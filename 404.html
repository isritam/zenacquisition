<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Zen Acquisition™</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="The page you are looking for does not exist or has been moved. Return to Zen Acquisition™ homepage or Zen Academy." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #080808;
      --card-bg: #121212;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --white: #f5f5f3;
      --muted: #8e8e93;
      --blue: #1a56db;
      --blue-glow: rgba(26, 86, 219, 0.35);
      --green: #19a900;
      --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --display: 'Space Grotesk', 'DM Sans', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--black);
      color: var(--white);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Ambient background gradient glow */
    body::before {
      content: "";
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, var(--blue-glow) 0%, rgba(8, 8, 8, 0) 70%);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    header {
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--white);
      text-decoration: none;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 620px;
      text-align: center;
    }

    .code-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .error-code {
      font-family: var(--display);
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.35) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 14px;
    }

    p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 36px;
    }

    .cta-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--white);
      color: var(--black);
      border: 1px solid var(--white);
    }

    .btn-primary:hover {
      background: #e2e2de;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .quick-links {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .quick-links a {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .quick-links a:hover {
      color: var(--white);
    }

    footer {
      padding: 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.82rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">
      <span class="brand-badge"></span>
      Zen Acquisition™
    </a>
  </header>

  <main>
    <div class="container">
      <div class="code-badge">Error 404 &bull; Page Not Found</div>
      <div class="error-code">404</div>
      <h1>We couldn't find the page you're looking for.</h1>
      <p>The page may have been moved, renamed, or no longer exists. Let's get you back on track.</p>
      
      <div class="cta-group">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/academy/" class="btn btn-secondary">Explore Zen Academy &rarr;</a>
      </div>

      <div class="quick-links">
        <a href="/terms-and-conditions/">Terms</a>
        <a href="/privacy-policy/">Privacy</a>
        <a href="/earning-disclaimer/">Disclaimer</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Zen Acquisition™. All rights reserved.
  </footer>

</body>
</html>
